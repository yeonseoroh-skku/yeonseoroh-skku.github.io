<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeonseo Roh | Portfolio</title>
    <style>
        /* Modern & Clean Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Smooth Scrolling Enabled */
        html {
            scroll-behavior: smooth;
        }

        body {
            color: #333;
            line-height: 1.7;
            background-color: #fcfcfd;
        }

        /* Navigation Header */
        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 1px 10px rgba(0,0,0,0.02);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .nav-links {
            list-style: none;
            display: flex;
        }

        .nav-links li {
            margin-left: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #555;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #6c5ce7;
        }

        /* Hero Section with Flex Layout */
        .hero {
            min-height: 65vh;
            background: linear-gradient(135deg, #f6f8fd 0%, #e3e8f8 50%, #dbe3f9 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 100px 20px 60px 20px;
            margin-top: 60px;
        }

        .hero-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1000px;
            width: 100%;
            gap: 50px;
        }

        .hero-text {
            text-align: left;
            flex: 1;
        }

        .hero h1 {
            font-size: 52px;
            color: #1a1a1a;
            margin-bottom: 15px;
            letter-spacing: -1px;
            font-weight: 800;
        }

        .hero p {
            font-size: 20px;
            color: #5c6b73;
            font-weight: 400;
            max-width: 550px;
        }

        /* Hero Moodboard Image Frame */
        .hero-moodboard {
            width: 320px;
            height: 320px;
            border-radius: 20px;
            overflow: hidden;
            border: 6px solid #ffffff;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            flex-shrink: 0;
        }

        .hero-moodboard img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Section Global Styles */
        section {
            max-width: 1100px;
            margin: 0 auto;
            padding: 90px 20px;
        }

        section h2 {
            font-size: 30px;
            color: #1a1a1a;
            margin-bottom: 45px;
            text-align: center;
            letter-spacing: -0.5px;
            font-weight: 700;
        }

        /* About Me Section */
        .about-box {
            background: #ffffff;
            padding: 45px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            border: 1px solid #f1f2f6;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .about-box p {
            font-size: 16px;
            color: #4a4a4a;
            margin-bottom: 20px;
        }

        .major-badge {
            display: inline-block;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        /* Projects Section */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 35px;
        }

        .project-card {
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            border: 1px solid #f1f2f6;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            text-decoration: none; /* 링크 밑줄 제거 */
            color: inherit;
        }

        .project-card:hover {
            transform: translateY(-7px);
            box-shadow: 0 15px 35px rgba(108, 92, 231, 0.08);
        }

        /* Streamlit 링크가 걸린 카드에 hover 마우스 포인터 및 효과 추가 */
        .project-card.clickable-link:hover {
            border-color: #6c5ce7;
            cursor: pointer;
        }

        .project-photo {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background-color: #f8f9fa;
        }

        .project-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .project-info {
            padding: 30px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .project-info h3 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #1a1a1a;
            font-weight: 700;
        }

        .project-info p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .tag-group {
            margin-top: auto;
        }

        .tag {
            display: inline-block;
            background: #f1f2f6;
            color: #5c6b73;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 6px;
            margin-bottom: 6px;
        }

        /* Coursework Section */
        .course-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .course-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #f1f2f6;
            box-shadow: 0 10px 30px rgba(0,0,0,0.01);
        }

        .course-card h3 {
            font-size: 19px;
            color: #1a1a1a;
            margin-bottom: 15px;
            border-left: 4px solid #6c5ce7;
            padding-left: 10px;
        }

        .course-list {
            list-style-type: none;
        }

        .course-list li {
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            padding-left: 15px;
            position: relative;
        }

        .course-list li::before {
            content: "•";
            color: #a29bfe;
            font-weight: bold;
            position: absolute;
            left: 0;
        }

        /* Skills Section */
        .skills-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
        }

        .skill-badge {
            background: #ffffff;
            color: #1a1a1a;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
            border: 1px solid #f1f2f6;
            transition: all 0.3s ease;
        }

        .skill-badge:hover {
            background: #6c5ce7;
            color: #ffffff;
            border-color: #6c5ce7;
            transform: scale(1.05);
        }

        /* Hobby Section (Interactive Accordion Styles) */
        .hobby-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .hobby-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #f1f2f6;
            box-shadow: 0 5px 15px rgba(0,0,0,0.01);
            text-align: left;
            height: fit-content;
        }

        .hobby-card .main-title {
            font-size: 17px;
            color: #1a1a1a;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
            outline: none;
            padding-bottom: 5px;
        }

        /* 기본 브라우저 화살표 숨기기 및 커스텀 */
        .hobby-card summary::-webkit-details-marker {
            display: none;
        }
        .hobby-card summary {
            list-style: none;
        }

        /* 1차 하위 카테고리 스타일 */
        .hobby-depth1 {
            margin-top: 15px;
            padding-left: 10px;
            border-left: 2px dashed #e3e8f8;
        }

        .hobby-depth1 details {
            margin-bottom: 10px;
        }

        .hobby-depth1 summary {
            font-size: 14px;
            font-weight: 600;
            color: #4a4a4a;
            cursor: pointer;
            padding: 3px 0;
            outline: none;
        }

        .hobby-depth1 summary:hover {
            color: #6c5ce7;
        }

        /* 2차 최종 불릿 리스트 스타일 */
        .hobby-bullet-list {
            list-style-type: none;
            padding-left: 15px;
            margin-top: 5px;
        }

        .hobby-bullet-list li {
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
            position: relative;
            padding-left: 12px;
        }

        .hobby-bullet-list li::before {
            content: "◦";
            color: #6c5ce7;
            font-weight: bold;
            position: absolute;
            left: 0;
        }

        /* Contact Section */
        .contact-box {
            background: linear-gradient(135deg, #ffffff 0%, #f9f9fb 100%);
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            border: 1px solid #f1f2f6;
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .contact-box p {
            font-size: 16px;
            color: #555;
            margin-bottom: 20px;
